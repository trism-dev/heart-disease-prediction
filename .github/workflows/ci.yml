name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q -m "not db"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vercel_app/package-lock.json
      - run: npm ci && npm run check:models && npm run build
        working-directory: vercel_app
      # The Python deployment collector needs static assets present at checkout.
      # Fail if the committed snapshot differs from a fresh frontend build.
      - run: git diff --exit-code -- public
        working-directory: vercel_app
